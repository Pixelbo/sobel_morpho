name: Baby Workflox
on: 
  [push, workflow_dispatch]
  
jobs:
  FisrtJob:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: stepUno
      uses: actions/checkout@v4
    - name: deps
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get install libsdl2-ttf-dev libsdl2-dev

    - name: stepDuoLinux
      if: ${{ runner.os == 'Linux' }}
      run: |
        ./CMakeGCC.sh
        make -C ./bin/make


    - name: stepTres
      run: |
        ./bin/make/Release/sobel
